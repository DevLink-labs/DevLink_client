name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test-threads:
        description: Rust 테스트 스레드 수. 비우면 cargo 기본값(코어 수). 병렬에서만 실패하는지 볼 때 1.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust 브로커·CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      # 인자 없이 실행하면 rust-toolchain.toml의 stable + rustfmt·clippy를 설치한다.
      - name: Rust toolchain 설치
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: 형식 검사
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 한 테스트 바이너리 안의 테스트를 병렬로 실행한다(cargo 기본값, 스레드 수 = 코어 수).
      # 테스트는 저마다 임시 설정 디렉터리와 임의 포트의 합성 중앙을 쓰고 환경 변수를 바꾸지 않는다.
      # 예전의 `--test-threads=1`은 초기 로컬 검증 방식을 옮긴 것이었다. 병렬에서만 실패하는 테스트가
      # 나오면 그 테스트의 공유 상태를 고친다. 원인 확인 중에는 수동 실행(workflow_dispatch)의
      # test-threads 입력에 1을 넣어 같은 커밋을 직렬로 돌려 비교한다.
      # 실패한 바이너리가 있어도 나머지를 모두 실행해 OS별 실패를 한 번에 드러낸다.
      # setup은 설정 경로의 상위 심볼릭 링크를 거부하므로, macOS 기본 TMPDIR(/var → /private/var)
      # 대신 링크가 없는 runner 임시 디렉터리를 쓴다.
      - name: 테스트
        if: runner.os != 'Windows'
        env:
          TMPDIR: ${{ runner.temp }}
          TEST_THREADS: ${{ inputs.test-threads }}
        run: |
          if [[ -n "$TEST_THREADS" && ! "$TEST_THREADS" =~ ^[1-9][0-9]*$ ]]; then
            echo "test-threads must be a positive integer" >&2; exit 2
          fi
          cargo test --workspace --all-targets --locked --no-fail-fast ${TEST_THREADS:+-- --test-threads=$TEST_THREADS}
      # 관리자 runner의 새 파일 소유자를 현재 사용자로 보정해 일반 사용자 환경과 맞춘다.
      - name: 테스트 (Windows, 소유자 보정)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TEST_THREADS: ${{ inputs.test-threads }}
        run: |
          if ($env:TEST_THREADS -and $env:TEST_THREADS -notmatch '^[1-9][0-9]*$') { throw 'test-threads must be a positive integer' }
          $threads = if ($env:TEST_THREADS) { @('--', "--test-threads=$env:TEST_THREADS") } else { @() }
          & "${{ github.workspace }}/.github/scripts/invoke-as-user-owner.ps1" cargo test --workspace --all-targets --locked --no-fail-fast @threads
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  mcp-server:
    name: MCP 서버 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json
      - name: 의존성 설치
        run: npm ci
      # 빌드, contracts/ 계약 대조, node --test 회귀를 함께 실행한다.
      - name: 빌드·계약 대조·테스트
        if: runner.os != 'Windows'
        run: npm test
      - name: 빌드·계약 대조·테스트 (Windows, 소유자 보정)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ github.workspace }}/.github/scripts/invoke-as-user-owner.ps1 npm test
